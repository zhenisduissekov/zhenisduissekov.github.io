<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>ZHENIS DUISSEKOV 1 | SOFTWARE DEVELOPER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOFTWARE DEVELOPER">
  <meta name="theme-color" content="#157878">

  <!-- SEO Tags -->
  <meta property="og:title" content="ZHENIS DUISSEKOV">
  <meta property="og:description" content="SOFTWARE DEVELOPER">
  <meta property="og:url" content="https://zhenisduissekov.github.io/">
  <meta property="og:site_name" content="ZHENIS DUISSEKOV">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta property="twitter:title" content="ZHENIS DUISSEKOV">

  <!-- GitHub Pages Cayman Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/pages-themes/cayman@v0.2.0/assets/css/style.css">
  <style>
    .chat-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }
    .chat-bubble {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .chat-container {
      display: none;
      flex-direction: column;
      background-color: white;
      border-radius: 10px;
      width: 360px;
      height: 480px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .chat-header {
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      position: relative;
    }
    .minimize-btn, .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      position: absolute;
      top: 8px;
      cursor: pointer;
    }
    .minimize-btn { right: 36px; }
    .close-btn { right: 12px; }
    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #f6f7f9;
    }
    .user {
      font-weight: bold;
      color: #2d6cdf;
      margin-top: 8px;
    }
    .bot {
      background-color: #eef3fb;
      border-radius: 6px;
      padding: 8px;
      margin: 4px 0 10px 10px;
    }
    .form-group {
      display: flex;
      border-top: 1px solid #ccc;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: none;
      outline: none;
    }
    .ask-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 0 16px;
      cursor: pointer;
      font-size: 16px;
    }
    .ask-btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1 class="project-name">ZHENIS DUISSEKOV</h1>
    <h2 class="project-tagline">SOFTWARE DEVELOPER</h2>
  </header>
  <main class="main-content" id="content">
    <!-- Your personal content goes here (already formatted above) -->
  </main>

  <!-- ZhenisGPT Chat Widget -->
  <div class="chat-widget">
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        ZhenisGPT
        <button class="minimize-btn" onclick="minimizeChat()">_</button>
        <button class="close-btn" onclick="resetChat()">✕</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="form-group">
        <input type="text" id="prompt" placeholder="Ask ZhenisGPT...">
        <button class="ask-btn" onclick="ask()">Ask</button>
      </div>
    </div>
    <div id="bubbleWrapper">
      <button class="chat-bubble" onclick="toggleChat()">💬</button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const promptInput = document.getElementById('prompt');
    const messagesDiv = document.getElementById('messages');

    function toggleChat() {
      const isVisible = chatContainer.style.display === 'flex';
      chatContainer.style.display = isVisible ? 'none' : 'flex';
      document.getElementById('bubbleWrapper').style.display = isVisible ? 'block' : 'none';
      if (!isVisible) setTimeout(() => promptInput.focus(), 100);
    }

    promptInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') ask();
    });

    async function ask() {
      const query = promptInput.value.trim();
      if (!query) return;
      messagesDiv.innerHTML += `<div class='user'>You: ${query}</div>`;
      promptInput.value = '';

      try {
        const res = await fetch('http://localhost:3000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();
        messagesDiv.innerHTML += `<div class='bot'>ZhenisGPT: ${data.answer}</div>`;
      } catch (err) {
        messagesDiv.innerHTML += `<div class='bot' style='color:red;'>ZhenisGPT: Error reaching server</div>`;
      }
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function minimizeChat() {
      chatContainer.style.display = 'none';
      document.getElementById('bubbleWrapper').style.display = 'block';
    }

    function resetChat() {
      messagesDiv.innerHTML = '';
      chatContainer.style.display = 'none';
      document.getElementById('bubbleWrapper').style.display = 'block';
    }
  </script>
</body>
</html>
